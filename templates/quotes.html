<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote of the day</title>
<script>
  /* inside Notion / another page (iframe) or ?embed=1: only the block. As a normal page: site stylesheet + header. */
  var EMBED = window.top !== window.self || /[?&]embed\b/.test(location.search);
  if (EMBED) document.documentElement.classList.add('embed');
  else document.write('<link rel="stylesheet" href="style.css">');
</script>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* inks (all colour lives here). Overlaps multiply, like riso prints. */
:root { --q-ink: #1f2328; --q-soft: #6b7280;
  --q-orange: #e4572e; --q-blue: #2f6fd6; --q-yellow: #f5b700; --q-green: #1f9d6b; --q-pink: #f0508f; --q-teal: #0f9fa8; }

.quotes, .quotes * { box-sizing: border-box; }
.embed body { margin: 0; background: transparent; }
.embed .page-head { display: none; }

.quotes { max-width: 46rem; margin: 0; padding: 1rem 0; color: var(--q-ink); font-weight: 400; font-size: 1rem; line-height: 1.5; font-family: var(--ff-label, "Golos Text", Inter, system-ui, sans-serif); }
.q { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: .5rem 2rem; align-items: center; margin: 0; animation: in .4s ease; }
@keyframes in { from { opacity: 0; transform: translateY(.3rem); } to { opacity: 1; transform: none; } }
.q blockquote { grid-column: 2; align-self: end; margin: 0; }
.q p { margin: 0; color: var(--q-ink); font-weight: 500; font-size: clamp(1.3rem, 3.2vw, 1.9rem); line-height: 1.3; font-family: var(--ff-title, Inter, "Golos Text", system-ui, sans-serif); letter-spacing: -.02em; }
.q figcaption { grid-column: 2; align-self: start; display: flex; flex-wrap: wrap; gap: 0 .5rem; font-size: .85rem; color: var(--q-soft); }
.q .who { font-weight: 600; color: var(--q-ink); }
.q .work::before { content: "· "; }
.q a { color: inherit; text-decoration: underline; text-decoration-color: rgba(0,0,0,.2); text-underline-offset: .2em; }
.q a:hover { text-decoration-color: var(--q-orange); }

/* ===== the pictures: eight compositions, each with its own three inks (--p, --s, --t) ===== */
.art { position: relative; width: 8rem; height: 8rem; grid-row: 1 / span 2; background-repeat: no-repeat; }
.art::before, .art::after { content: ""; position: absolute; mix-blend-mode: multiply; }

/* 1 · circle, square, dot */
.q[data-v="1"] { --p: var(--q-orange); --s: var(--q-blue); --t: var(--q-yellow); }
.q[data-v="1"] .art { background: radial-gradient(circle at 90% 12%, var(--t) 0 .7rem, transparent .75rem); }
.q[data-v="1"] .art::before { left: 0; top: 0; width: 5.8rem; height: 5.8rem; border-radius: 50%; background: var(--p); }
.q[data-v="1"] .art::after  { right: 0; bottom: 0; width: 4rem; height: 4rem; background: var(--s); }

/* 2 · ring, dot, square */
.q[data-v="2"] { --p: var(--q-green); --s: var(--q-pink); --t: var(--q-yellow); }
.q[data-v="2"] .art { background: linear-gradient(var(--t), var(--t)) 100% 0 / 1.5rem 1.5rem no-repeat; }
.q[data-v="2"] .art::before { left: 0; top: .6rem; width: 6.4rem; height: 6.4rem; border-radius: 50%; border: 1.2rem solid var(--p); }
.q[data-v="2"] .art::after  { right: 0; bottom: 0; width: 3rem; height: 3rem; border-radius: 50%; background: var(--s); }

/* 3 · two overlapping circles, small square */
.q[data-v="3"] { --p: var(--q-pink); --s: var(--q-teal); --t: var(--q-yellow); }
.q[data-v="3"] .art { background: linear-gradient(var(--t), var(--t)) 50% 100% / 2rem 2rem no-repeat; }
.q[data-v="3"] .art::before { left: 0; top: .6rem; width: 5.2rem; height: 5.2rem; border-radius: 50%; background: var(--p); }
.q[data-v="3"] .art::after  { right: 0; top: .6rem; width: 5.2rem; height: 5.2rem; border-radius: 50%; background: var(--s); }

/* 4 · Bauhaus tiles */
.q[data-v="4"] { --p: var(--q-pink); --s: var(--q-blue); --t: var(--q-yellow); }
.q[data-v="4"] .art { background: linear-gradient(var(--t), var(--t)) 0 100% / 3.7rem 3.7rem no-repeat, radial-gradient(circle at 100% 100%, var(--p) 0 3.8rem, transparent 3.85rem); }
.q[data-v="4"] .art::before { left: 0; top: 0; width: 3.8rem; height: 3.8rem; border-radius: 3.8rem 0 0 0; background: var(--p); }
.q[data-v="4"] .art::after  { right: 0; top: 0; width: 3.7rem; height: 3.7rem; border-radius: 50%; background: var(--s); }

/* 5 · nested arches */
.q[data-v="5"] { --p: var(--q-blue); --s: var(--q-orange); --t: var(--q-yellow); }
.q[data-v="5"] .art::before { left: 0; bottom: 0; width: 8rem; height: 4rem; border-radius: 8rem 8rem 0 0; background: var(--p); }
.q[data-v="5"] .art::after  { left: 1.4rem; bottom: 0; width: 5.2rem; height: 2.6rem; border-radius: 5.2rem 5.2rem 0 0; background: radial-gradient(circle at 50% 100%, var(--t) 0 1.1rem, var(--s) 1.15rem); mix-blend-mode: normal; }

/* 6 · triangle, circle, square */
.q[data-v="6"] { --p: var(--q-teal); --s: var(--q-orange); --t: var(--q-pink); }
.q[data-v="6"] .art { background: linear-gradient(var(--t), var(--t)) 0 0 / 1.4rem 1.4rem no-repeat; }
.q[data-v="6"] .art::before { left: 0; bottom: 0; width: 6.6rem; height: 6rem; background: var(--p); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.q[data-v="6"] .art::after  { right: 0; top: 0; width: 4.4rem; height: 4.4rem; border-radius: 50%; background: var(--s); }

/* 7 · halftone disc, circle, square */
.q[data-v="7"] { --p: var(--q-orange); --s: var(--q-teal); --t: var(--q-blue); }
.q[data-v="7"] .art { background: linear-gradient(var(--t), var(--t)) 0 100% / 2rem 2rem no-repeat; }
.q[data-v="7"] .art::before { left: 0; top: 0; width: 6rem; height: 6rem; border-radius: 50%; background: radial-gradient(var(--s) 2.2px, transparent 2.8px) 0 0 / .6rem .6rem; }
.q[data-v="7"] .art::after  { right: 0; bottom: 0; width: 4.4rem; height: 4.4rem; border-radius: 50%; background: var(--p); }

/* 8 · split circle */
.q[data-v="8"] { --p: var(--q-orange); --s: var(--q-green); --t: var(--q-blue); }
.q[data-v="8"] .art { background: radial-gradient(circle at 12% 88%, var(--t) 0 .9rem, transparent .95rem); }
.q[data-v="8"] .art::before { left: 0; top: .5rem; width: 7rem; height: 3.5rem; border-radius: 7rem 7rem 0 0; background: var(--p); }
.q[data-v="8"] .art::after  { right: 0; bottom: .5rem; width: 7rem; height: 3.5rem; border-radius: 0 0 7rem 7rem; background: var(--s); }

/* ?gallery=1: all eight pictures, numbered */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, 9.5rem); gap: 1.6rem; }
.gallery .q { display: block; }
.gallery .num { margin-top: .5rem; font-size: .85rem; color: var(--q-soft); }

@media (max-width: 34rem) {
  .q { grid-template-columns: 1fr; }
  .art { grid-row: auto; width: 5rem; height: 5rem; margin-bottom: .5rem; }
  .art::before, .art::after { scale: .625; transform-origin: inherit; }
  .q blockquote, .q figcaption { grid-column: 1; }
}
</style>
</head>
<body>
<div class="frame">
  <h1 class="page-head">Quotes</h1>
  <div class="crumbs page-head"><p><a href="index.html">Home</a></p></div>
  <main class="quotes" id="quotes" aria-live="polite"></main>
</div>

<script>
  /* your selected quotes. "art" (1-8) is optional: it forces a picture for that quote. */
  const QUOTES = [
    { text: 'Трезвость - это не постоянное чувство победы, а просто ощущение, что в какой-то рандомный вторник вы снова не пьете.', who: 'Дарья Кузина', work: 'video' },
    { text: 'В этой непосредственности предполагаемого людская речь и журчание реки навевают одно и то же.', who: 'Чжуан-цзы', work: 'Чжуан-цзы, Предисловие' },
    { text: 'Мы напрасно думаем, братья,<br>Что грозна небесная рать.<br>Ох, и жалкое же занятье —<br>Нас — таких! — посмертно карать!<br><…><br>И когда распоследней бурей<br>Наши грешные дни сметут, —<br>Там — нам всем ничего не будет.<br>Нам за все воздается — тут.', who: 'Дмитрий Быков' },
  ];
  const ARTS = 8;
  /* optional, one line per topic instead of one per quote: quotes with that tag take their pictures from this list */
  const TAG_ART = {};                                          // e.g. { epic: [1, 6], philosophy: [3, 8] }

  const q = new URLSearchParams(location.search);              // ?date=2026-12-24 to preview a day, ?tag=epic, ?gallery=1, ?embed=1 to see the Notion version
  const box = document.getElementById('quotes');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function figure(it) {
    const f = el('figure', 'q');
    const set = TAG_ART[it.tag];
    f.dataset.v = String(it.art || (set && set[it.i % set.length]) || (it.i % ARTS) + 1);   // a quote keeps its picture
    const bq = el('blockquote');
    bq.appendChild(el('p', '', it.text));
    const cap = el('figcaption');
    cap.appendChild(el('span', 'who', it.who));
    if (it.work) {
      const w = it.page ? el('a', 'work', it.work) : el('span', 'work', it.work);
      if (it.page) w.href = it.page;
      cap.appendChild(w);
    }
    f.append(el('div', 'art'), bq, cap);
    return f;
  }

  /* ----- quote of the day: random, but every quote comes up once before any repeats ----- */
  const list = QUOTES.map((it, i) => ({ ...it, i })).filter(it => !q.get('tag') || it.tag === q.get('tag'));
  const when = () => (q.get('date') ? new Date(q.get('date') + 'T12:00:00') : new Date());
  const rng = seed => () => {                                  // small seeded generator (mulberry32)
    seed = (seed + 0x6D2B79F5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  function shuffled(n, seed) {
    const r = rng(seed), a = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function todayIndex() {
    const n = list.length, d = when();
    if (n < 2) return 0;
    const day = Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);   // local calendar day
    const cycle = Math.floor(day / n);
    let prevLast = -1, order = [];
    for (let c = 0; c <= cycle; c++) {
      order = shuffled(n, c + 1);
      if (order[0] === prevLast) [order[0], order[1]] = [order[1], order[0]];           // no repeat across two cycles
      prevLast = order[n - 1];
    }
    return order[day % n];
  }

  function render() {
    box.replaceChildren();
    if (q.has('gallery')) {
      const g = el('div', 'gallery');
      for (let v = 1; v <= ARTS; v++) {
        const f = el('figure', 'q');
        f.dataset.v = String(v);
        f.append(el('div', 'art'), el('div', 'num', 'Picture ' + v));
        g.appendChild(f);
      }
      box.appendChild(g);
      return;
    }
    if (!list.length) return;
    box.appendChild(figure(list[todayIndex()]));
  }
  render();
  (function tick() {                                           // a page left open changes at midnight
    const n = new Date();
    setTimeout(() => { render(); tick(); }, new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n + 1000);
  })();
</script>
</body>
</html>
