<script>
/* =====================================================================
   REUSABLE TREE-OF-LIFE ENGINE (flow-based)
   To build a new page: copy this file, replace only TREE_DATA below.

   NODES — one entry per name in the diagram:
     id, name, native (optional), kind ("rank" solid border | "lineage" dashed),
     rankLabel (small badge, optional), color (era CSS var name),
     html (explanation — may use .highlight and .term spans),
     today (optional callout), images (optional array of {src, caption}
     — src is the image URL/path; leave it out and the card shows a
     placeholder tile, so you can add real images gradually)

   GROUPS — dashed bracket around several nodes (informal umbrella term):
     id, label, memberIds, color, name, native, html, today

   EVENTS — a clickable pill between two rows, e.g. a merger:
     id, label, from (array of parent node ids), to (child node id),
     color, name, html, today

   LAYOUT — the reading order, top to bottom. Only two entry types:
     { type:'row', items:[ {id, from?, sub?}, ... ], group?:'groupId' }
       — from (optional) draws a simple line from that parent, for
         items that sit as a peer in a different row
       — sub (optional, array of {id}) nests child nodes directly
         under THIS item in the same column, connected by a short
         line — use this instead of `from` when a node is a simple,
         non-merged child that shouldn't visually read as a peer of
         whatever else is in the row (e.g. a side-branch)
       — group (optional, on the row) wraps ALL items in that row in
         a dashed bracket referencing a GROUPS entry
     { type:'event', id:'eventId' }
       — draws lines from every event.from parent down to the chip,
         and from the chip down to event.to
   ===================================================================== */

const TREE_DATA = {

      today:`...`,
      images:[
        {src:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Sn%C3%ADmek_ze_skenovac%C3%ADho_elektronov%C3%A9ho_mikroskopu_Methanobacterium_formicicum.jpg/500px-Sn%C3%ADmek_ze_skenovac%C3%ADho_elektronov%C3%A9ho_mikroskopu_Methanobacterium_formicicum.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail'},
      ] },

      today:`still exists as "blue-green algae".`,
      images:[
        {src:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5sDrTezdJoDtigu_B1pMN-XnTmEYyo4zhkA_tBIOpch2ep3UsMrLP6LHr4qpMnRfAt8TJskc4JHlxABYrPfLSrIi0qqdG9wbUNo8F67w&s=10'}

      ] },

        {src: 'https://mediasvc.eurekalert.org/Api/v1/Multimedia/adfaa3b8-c9be-4724-b092-a70f51c4a437/Rendition/low-res/Content/Public', caption:'Cloudina, the earliest animals to evolve hard, mineralized outer shells'},
        {src: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCmocy_WB0m7tolyznESRfm3aXwmgIWRII121SJwSvsQ&s=10', caption:'Cloudina, illustration'}

  ],

  groups: [
    { id:'prokaryotes', label:'Prokaryotes', memberIds:['bacteria','archaea'], color:'archean',
      name:'Prokaryotes', native:'Прокариоты',
      html:`<p>An informal umbrella term for cells with no nucleus.</p>`,
      today:`Every bacterium and archaeon alive today is a prokaryote.` }
  ],

  events: [
    { id:'merger1', label:'1st merger', from:['bacteria','asgardarchaea'], to:'eukaryotes', color:'proterozoic',
      name:'Endosymbiosis — 1st merger',
      html:`<p>An archaeon engulfed a bacterium and, instead of digesting it, kept it as a permanent internal partner. This <span class="term" data-def="one organism living inside another, to their mutual benefit.">endosymbiosis</span> is the root of every eukaryotic cell.</p>`,
    },

      name:'Endosymbiosis — 2nd merger',

    }
  ],

  layout: [
    { type:'row', group:'prokaryotes', items:[
      {id:'bacteria', sub:[{id:'cyanobacteria'}]},
      {id:'archaea', sub:[{id:'methanobacterium'}, {id:'asgardarchaea'}]}
    ] },
    { type:'event', id:'merger1' },
    { type:'row', items:[ {id:'eukaryotes'} ] },
    { type:'event', id:'merger2' },
    { type:'row', items:[
      {id:'algae', sub:[{id:'bangiomorphapubescens'}]},
      {id:'animalline', from:'eukaryotes', sub:[{id:'ediacaran'}]} ] },

};

/* ---- Renderer — generic, do not need to edit this for a new page ---- */
const flow = document.getElementById('treeFlow');
const linksSvg = document.getElementById('treeLinks');
const nodesById = Object.fromEntries(TREE_DATA.nodes.map(n => [n.id, n]));
const groupsById = Object.fromEntries((TREE_DATA.groups||[]).map(g => [g.id, g]));
const eventsById = Object.fromEntries((TREE_DATA.events||[]).map(e => [e.id, e]));
const simpleLinks = []; // {fromId, toId} for plain single-parent connectors

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function buildCarousel(images) {
  const slides = images.map((img, i) => `
    <figure class="carousel-slide" data-caption="${(img.caption||'').replace(/"/g,'&quot;')}">
      <div class="img-slot">${img.src ? `<img src="${img.src}" alt="${(img.caption||'').replace(/"/g,'&quot;')}">` : `image ${i+1}`}</div>
    </figure>`).join('');
  return `<div class="carousel"><div class="carousel-viewport"><div class="carousel-track">${slides}</div>
    <button class="carousel-arrow carousel-prev" aria-label="Previous image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button class="carousel-arrow carousel-next" aria-label="Next image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div><div class="carousel-foot"><div class="carousel-caption"></div><div class="carousel-dots"></div></div></div>`;
}
function wireCarousel(root) {
  root.querySelectorAll('.carousel').forEach(carousel => {
    const track = carousel.querySelector('.carousel-track');
    const slides = Array.from(carousel.querySelectorAll('.carousel-slide'));
    const captionEl = carousel.querySelector('.carousel-caption');
    const dotsWrap = carousel.querySelector('.carousel-dots');
    let index = 0;
    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'carousel-dot' + (i===0 ? ' is-active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
    });
    const dots = Array.from(dotsWrap.children);
    function goTo(i) {
      index = (i + slides.length) % slides.length;
      track.style.transform = `translateX(-${index*100}%)`;
      dots.forEach((d,di) => d.classList.toggle('is-active', di===index));
      captionEl.textContent = slides[index].dataset.caption || '';
    }
    carousel.querySelector('.carousel-prev').addEventListener('click', () => goTo(index-1));
    carousel.querySelector('.carousel-next').addEventListener('click', () => goTo(index+1));
    let startX = 0;
    track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
    track.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - startX;
      if (dx > 40) goTo(index-1); else if (dx < -40) goTo(index+1);
    });
    goTo(0);
  });
}

function buildMedia(images) {
  if (!images || !images.length) return '';

  // If only 1 image, render a simple image container (no arrows/dots)
  if (images.length === 1) {
    const img = images[0];
    return `
      <figure class="single-img-slot">
        <div class="img-slot">
          ${img.src ? `<img src="${img.src}" alt="${(img.caption||'').replace(/"/g,'&quot;')}">` : 'image'}
        </div>
        ${img.caption ? `<figcaption class="carousel-caption">${img.caption}</figcaption>` : ''}
      </figure>`;
  }
  return buildCarousel(images);
}
function cardHtml(item, badge) {
  const hasImages = item.images && item.images.length;
  const imagePos = item.imagePos || 'bottom';
  const layoutClass = imagePos === 'right' ? 'img-right' : 'img-bottom';
  return `
    <div class="expand-pad">
      <section class="card" style="--accent-color:var(--${item.color})">
        <div class="card-head">
          <h2 class="card-title">${item.name}${item.native ? `<span class="card-native">${item.native}</span>` : ''}</h2>
          ${badge ? `<span class="card-tag">${badge}</span>` : ''}
        </div>
        <div class="card-body ${hasImages ? '' : 'no-image'}">
          <div class="card-text">
            ${item.html}
            ${item.today ? `<div class="today-box"><strong>Today:</strong> ${item.today}</div>` : ''}
          </div>
          ${hasImages ? buildCarousel(item.images) : ''}
        </div>
      </section>
    </div>`;
}

const detailSide = document.getElementById('detailSide');
let activeId = null;

function toggleExpand(id, btn, item, badge) {
  const wasOpenForThis = activeId === id;
  document.querySelectorAll('.node-btn.is-active, .group-chip.is-active, .event-chip-btn.is-active').forEach(b => b.classList.remove('is-active'));

  if (wasOpenForThis) {
    detailSide.innerHTML = '<p class="detail-placeholder">Tap a name to see its card here.</p>';
    activeId = null;
  } else {
    detailSide.innerHTML = cardHtml(item, badge);
    wireCarousel(detailSide);
    btn.classList.add('is-active');
    activeId = id;
    if (window.innerWidth <= 760) {
      setTimeout(() => detailSide.scrollIntoView({ behavior:'smooth', block:'start' }), 60);
    }
  }
}

function buildNodeCol(item) {
  const n = nodesById[item.id];
  const col = document.createElement('div');
  col.className = 'tree-col';
  col.dataset.nodeId = n.id;
  const btn = document.createElement('button');
  btn.className = `node-btn kind-${n.kind}`;
  btn.style.setProperty('--accent-color', `var(--${n.color})`);
  btn.dataset.id = n.id;
  btn.textContent = n.name;
  btn.addEventListener('click', () => toggleExpand(n.id, btn, n, n.rankLabel || null));
  col.appendChild(btn);
  if (item.from) simpleLinks.push({ fromId:item.from, toId:n.id });

  if (item.sub && item.sub.length) {
    const subWrap = document.createElement('div');
    subWrap.className = 'sub-branch';
    subWrap.style.display = 'flex';
    subWrap.style.flexDirection = 'row';
    subWrap.style.gap = '8px';

    item.sub.forEach(subItem => {
      const subN = nodesById[subItem.id];
      const subBtn = document.createElement('button');
      subBtn.className = `node-btn node-btn--small kind-${subN.kind}`;
      subBtn.style.setProperty('--accent-color', `var(--${subN.color})`);
      subBtn.dataset.id = subN.id;
      subBtn.textContent = subN.name;
      subBtn.addEventListener('click', () => toggleExpand(subN.id, subBtn, subN, subN.rankLabel || null));
      subWrap.appendChild(subBtn);
      simpleLinks.push({ fromId:item.id, toId:subN.id });
    });
    col.appendChild(subWrap);
  }
  return col;
}

TREE_DATA.layout.forEach(entry => {
  if (entry.type === 'row') {
    const rowEl = document.createElement('div');
    rowEl.className = 'tree-row';

    if (entry.group) {
      const g = groupsById[entry.group];
      const wrap = document.createElement('div');
      wrap.className = 'group-wrap';
      wrap.style.setProperty('--group-color', `var(--${g.color})`);
      const chip = document.createElement('button');
      chip.className = 'group-chip';
      chip.textContent = g.label;
      chip.dataset.id = g.id;
      chip.addEventListener('click', () => toggleExpand(g.id, chip, g, 'informal group'));
      wrap.appendChild(chip);
      entry.items.forEach(item => wrap.appendChild(buildNodeCol(item)));
      rowEl.appendChild(wrap);
    } else {
      entry.items.forEach(item => rowEl.appendChild(buildNodeCol(item)));
    }
    flow.appendChild(rowEl);
  }

  if (entry.type === 'event') {
    const ev = eventsById[entry.id];
    const evRow = document.createElement('div');
    evRow.className = 'event-row';
    const chip = document.createElement('button');
    chip.className = 'event-chip-btn';
    chip.textContent = '?';
    chip.title = ev.label;
    chip.setAttribute('aria-label', ev.label);
    chip.dataset.id = ev.id;
    chip.addEventListener('click', () => toggleExpand(ev.id, chip, ev, 'event'));
    evRow.appendChild(chip);
    flow.appendChild(evRow);
  }
});

/* ---- Connector lines: computed from real DOM positions, redrawn on any layout change ---- */
function redrawLinks() {
  // Position each event chip horizontally above its actual child node,
  // instead of just centering it in the diagram.
  (TREE_DATA.events||[]).forEach(ev => {
    const chip = document.querySelector(`.event-chip-btn[data-id="${ev.id}"]`);
    const toEl = document.querySelector(`.node-btn[data-id="${ev.to}"]`);
    if (!chip || !toEl) return;
    const rowRect = chip.parentElement.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();
    let left = (toRect.left + toRect.width/2) - rowRect.left - 13; // 13 = half chip width
    left = Math.max(4, Math.min(left, rowRect.width - 30));
    chip.style.left = `${left}px`;
  });

  const flowRect = flow.getBoundingClientRect();
  linksSvg.innerHTML = '';
  linksSvg.setAttribute('width', flowRect.width);
  linksSvg.setAttribute('height', flowRect.height);

  function centerOf(el, edge) {
    const r = el.getBoundingClientRect();
    return { x: r.left - flowRect.left + r.width/2, y: (edge==='bottom' ? r.bottom : r.top) - flowRect.top };
  }
  function drawLine(p1, p2, dashed) {
    const path = svgEl('path', {
      d:`M${p1.x},${p1.y} C${p1.x},${(p1.y+p2.y)/2} ${p2.x},${(p1.y+p2.y)/2} ${p2.x},${p2.y}`,
      fill:'none', stroke: dashed ? 'var(--merge)' : 'var(--ink-soft)', 'stroke-width':'1.5'
    });
    if (dashed) path.setAttribute('stroke-dasharray', '4 4');
    linksSvg.appendChild(path);
  }

  simpleLinks.forEach(l => {
    const from = document.querySelector(`.node-btn[data-id="${l.fromId}"]`);
    const to = document.querySelector(`.node-btn[data-id="${l.toId}"]`);
    if (from && to) drawLine(centerOf(from,'bottom'), centerOf(to,'top'), false);
  });

  (TREE_DATA.events||[]).forEach(ev => {
    const chip = document.querySelector(`.event-chip-btn[data-id="${ev.id}"]`);
    if (!chip) return;
    ev.from.forEach(fid => {
      const from = document.querySelector(`.node-btn[data-id="${fid}"]`);
      if (from) drawLine(centerOf(from,'bottom'), centerOf(chip,'top'), true);
    });
    const to = document.querySelector(`.node-btn[data-id="${ev.to}"]`);
    if (to) drawLine(centerOf(chip,'bottom'), centerOf(to,'top'), true);
  });
}

redrawLinks();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(redrawLinks);
}
setTimeout(redrawLinks, 300);
setTimeout(redrawLinks, 1000);
window.addEventListener('resize', redrawLinks);
document.addEventListener('click', (e) => {
  if (!e.target.closest('.node-btn, .group-chip, .event-chip-btn, .detail-side')) {
    detailSide.innerHTML = '<p class="detail-placeholder">Tap a name to see its card here.</p>';
    activeId = null;
    document.querySelectorAll('.is-active').forEach(b => b.classList.remove('is-active'));
  }
});
</script>
</body>
</html>
